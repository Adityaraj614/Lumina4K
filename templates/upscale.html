<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Single Image Upscaling</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body.upscale-studio-page {
            display: block;
            padding: 0;
            background: radial-gradient(
                circle at top,
                rgba(255, 255, 255, 0.08),
                transparent 40%
            ),
            #0b0b0c;
            color: #ffffff;
        }

        body.upscale-studio-page::before {
            background: none;
        }

        .upscale-page {
            width: min(1440px, 100%);
            margin: 0 auto;
            padding: 40px 32px 56px;
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            backdrop-filter: blur(8px);
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            filter: brightness(1.08);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .page-title {
            margin: 0;
            text-align: center;
            font-size: 42px;
            font-weight: 700;
            color: #f5f5f5;
        }

        .page-subtitle {
            margin: 10px 0 0;
            text-align: center;
            color: #9ca3af;
        }

        .container {
            display: flex;
            gap: 40px;
            padding: 40px 80px;
            align-items: center;
        }

        .left-panel {
            width: 35%;
        }

        .right-panel {
            width: 65%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            background: #111217;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .form-card label,
        .form-card legend,
        .form-card span {
            color: #f9fafb;
        }

        .form-card input[type="file"],
        .form-card select {
            width: 100%;
            background: #191c23;
            color: #ffffff;
            border: 1px solid #2d3340;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 18px;
        }

        .form-card input[type="file"]:focus,
        .form-card select:focus {
            outline: none;
            border-color: #f4c430;
            box-shadow: 0 0 0 3px rgba(255, 208, 0, 0.14);
        }

        .form-card .mode-group {
            margin-bottom: 18px;
            background: #161920;
            border: 1px solid #292f3b;
        }

        .form-card .mode-group legend {
            color: #b7becb;
        }

        .form-card .mode-option {
            color: #e5e7eb;
        }

        .form-card #modeSuggestionText {
            color: #f9d74a;
            margin-bottom: 0;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffd000, #ffb300);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 26px rgba(255, 195, 0, 0.18);
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #ffe066, #ffc107);
            filter: none;
            transform: translateY(-1px);
        }

        .upscale-status {
            min-height: 24px;
            margin-top: 14px;
            color: #9ca3af;
        }

        .upscale-status.success {
            color: #9ae6b4;
        }

        .upscale-status.error {
            color: #fca5a5;
        }

        .loading-text {
            margin: 12px 0 0;
            color: #f9d74a;
        }

        #comparison-section {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        #comparison-section[hidden] {
            display: none !important;
        }

        .preview-box {
            width: 50%;
            background: #0f1115;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .preview-title {
            text-align: center;
            margin-bottom: 10px;
            color: #aaa;
            display: block;
            font-size: 14px;
        }

        .preview-box img {
            width: 100%;
            min-height: 420px;
            border-radius: 10px;
            object-fit: contain;
            background: #141821;
        }

        .download-btn {
            margin-top: 10px;
            width: 100%;
            background: linear-gradient(135deg, #ffd000, #ffb300);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 26px rgba(255, 195, 0, 0.18);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #ffe066, #ffc107);
            transform: translateY(-1px);
            filter: none;
        }

        .demo-preview {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .demo-preview.processing::after {
            content: "Processing...";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #ffd000;
            font-size: 18px;
            font-weight: 600;
            background: rgba(11, 11, 12, 0.42);
            border-radius: 12px;
        }

        .demo-preview img {
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            opacity: 0.85;
            box-shadow: 0 20px 60px rgba(255, 200, 0, 0.15);
            transition: 0.3s;
        }

        .demo-preview img:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        .demo-text {
            position: absolute;
            top: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            width: 100%;
            z-index: 1;
        }

        @media (max-width: 1080px) {
            .container {
                padding: 32px 24px;
                gap: 24px;
            }
        }

        @media (max-width: 860px) {
            .container {
                flex-direction: column;
                padding: 28px 0 0;
            }

            .left-panel,
            .right-panel,
            .preview-box {
                width: 100%;
            }

            #comparison-section {
                flex-direction: column;
            }

            .preview-box img {
                min-height: 260px;
            }
        }
    </style>
</head>
<body class="upscale-studio-page">
    <main class="upscale-page">
        <a class="back-link" href="/">Back to Home</a>
        <section>
            <h1 class="page-title">Single Image Upscaling</h1>
            <p class="page-subtitle">Upload one image, enhance it with AI or resize mode, then compare the result before downloading.</p>
        </section>

        <div class="container">
            <aside class="left-panel">
                <article class="form-card">
                    <form id="upscale-form" class="upscale-form">
                        <div class="upscale-field">
                            <label for="single-image">Image Upload</label>
                            <input id="single-image" name="image" type="file" accept="image/*" required>
                        </div>

                        <div class="upscale-field">
                            <label for="scale">Scale</label>
                            <select id="scale" name="scale">
                                <option value="2">2x</option>
                                <option value="4" selected>4x</option>
                                <option value="8">8x</option>
                            </select>
                        </div>

                        <fieldset class="mode-group">
                            <legend>Processing mode</legend>

                            <label class="mode-option" for="mode-ai">
                                <input id="mode-ai" type="radio" name="mode" value="ai" checked>
                                <span>Enhance (AI)</span>
                            </label>

                            <label class="mode-option" for="mode-resize">
                                <input id="mode-resize" type="radio" name="mode" value="resize">
                                <span>Resize</span>
                            </label>

                            <p id="modeSuggestionText"></p>
                        </fieldset>

                        <button id="upscale-button" class="primary-btn" type="submit">Upscale Image</button>
                        <p id="loadingText" class="loading-text" style="display:none;">Processing image...</p>
                        <div id="upscale-status" class="status upscale-status" aria-live="polite"></div>
                    </form>
                </article>
            </aside>

            <section class="right-panel">
                <div class="demo-preview">
                    <div class="demo-text">See how AI enhances details and sharpness</div>
                    <img id="preview-image" src="/static/images/demo_upscale.jpg" alt="Demo Preview">
                </div>
            </section>
        </div>

        <section id="comparison-section" class="preview-container" hidden>
            <div class="preview-box">
                <span class="preview-title">Original</span>
                <img id="original-preview" class="preview-image" alt="Original uploaded image">
            </div>

            <div class="preview-box">
                <span class="preview-title">Upscaled</span>
                <img id="upscaled-preview" class="preview-image" alt="Upscaled result">
                <button id="download-button" class="download-btn" type="button" hidden>Download Upscaled Image</button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        const comparisonSection = document.getElementById("comparison-section");

        if (comparisonSection) {
            const syncComparisonSection = () => {
                comparisonSection.style.display = comparisonSection.hidden ? "none" : "flex";
            };

            syncComparisonSection();

            const previewObserver = new MutationObserver(syncComparisonSection);
            previewObserver.observe(comparisonSection, { attributes: true, attributeFilter: ["hidden"] });
        }
    </script>
</body>
</html>
